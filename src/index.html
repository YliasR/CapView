<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob: mediastream:">
  <title>CapView</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <video id="video" autoplay playsinline muted></video>

  <div id="status">Pick a video source to start.</div>

  <div id="bar">
    <label>Video
      <select id="videoSelect"></select>
    </label>
    <label>Resolution
      <select id="resSelect">
        <option value="1920x1080@60">1080p60</option>
        <option value="1920x1080@30">1080p30</option>
        <option value="1280x720@60">720p60</option>
        <option value="1280x720@30">720p30</option>
        <option value="auto">Auto</option>
      </select>
    </label>
    <label>Audio
      <select id="audioSelect"></select>
    </label>
    <label class="vol">Volume
      <input id="volume" type="range" min="0" max="1" step="0.01" value="1">
    </label>
    <button id="reload" title="Restart capture">Restart</button>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
